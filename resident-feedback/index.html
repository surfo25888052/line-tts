<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#175b49">
  <meta name="description" content="里民意見反映與通報表單">
  <title>里民意見表</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#1b2b28;background:#f4f8f6;font-synthesis:none}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:18px 14px 40px}
    main{max-width:600px;margin:0 auto}
    .head{padding:22px 10px 16px;text-align:center}
    .head h1{font-size:1.65rem;margin:6px 0 10px;letter-spacing:.025em}
    .panel{background:#fff;border:1px solid #dce7df;border-radius:18px;box-shadow:0 6px 28px rgba(17,54,40,.055);padding:22px 20px}
    label{display:block;font-weight:700;margin:19px 0 8px;font-size:.96rem}
    label:first-child{margin-top:0}
    .req{color:#b72b2b}
    input,textarea{display:block;width:100%;font:inherit;font-size:16px;color:#1b2b28;background:#fcfefd;border:1px solid #baccc3;border-radius:10px;padding:13px 14px;outline-offset:2px}
    input:focus,textarea:focus{border-color:#208663;outline:2px solid #d2f0e1}
    textarea{min-height:175px;resize:vertical;line-height:1.65}
    .status{border-radius:10px;padding:11px 12px;font-size:.9rem;line-height:1.6;margin:0 0 15px;background:#edf5f0;color:#275941}
    .status.error{background:#fff2f0;color:#a12820}
    .status[hidden]{display:none}
    button{width:100%;margin-top:24px;background:#175b49;border:none;border-radius:11px;color:white;font-size:1.05rem;font-weight:700;padding:15px;cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.55}
    @media(max-width:420px){.panel{padding:18px 15px}.head h1{font-size:1.48rem}}
  </style>
  <script src="./config.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
<main>
  <header class="head"><h1>里民意見表</h1></header>
  <section class="panel">
    <p id="status" class="status" role="status" aria-live="polite" hidden></p>
    <form id="feedbackForm">
      <label for="residentName">姓名 <span class="req">*</span></label>
      <input id="residentName" name="residentName" maxlength="60" autocomplete="name" required placeholder="請輸入姓名">
      <label for="phone">聯絡電話 <span class="req">*</span></label>
      <input id="phone" name="phone" type="tel" inputmode="tel" maxlength="40" autocomplete="tel" required placeholder="請輸入聯絡電話">
      <label for="address">地址 <span class="req">*</span></label>
      <input id="address" name="address" maxlength="200" autocomplete="street-address" required placeholder="請輸入地址">
      <label for="opinion">請提出您的意見 <span class="req">*</span></label>
      <textarea id="opinion" name="opinion" maxlength="1600" required placeholder="請輸入您的意見"></textarea>
      <button type="submit" id="submitButton" disabled>送出里民意見</button>
    </form>
  </section>
</main>
<script>
(function(){
  'use strict';
  const form=document.getElementById('feedbackForm');
  const status=document.getElementById('status');
  const submit=document.getElementById('submitButton');
  const config=window.RESIDENT_FEEDBACK_CONFIG||{};
  let ready=false,sending=false,formId=null;
  submit.disabled=true;
  function setStatus(message,error){status.textContent=message;status.className=error?'status error':'status';status.hidden=!message;}
  function cleanOneLine(v){return String(v||'').replace(/[\r\n\u2028\u2029]+/g,' ').trim();}
  function makeId(){const a=new Uint32Array(2);crypto.getRandomValues(a);return 'RF'+Date.now().toString(36).toUpperCase()+a[0].toString(36).toUpperCase()+a[1].toString(36).toUpperCase();}
  function getFormData(){
    if(!formId)formId=makeId();
    return {id:formId,name:cleanOneLine(document.getElementById('residentName').value),
      phone:cleanOneLine(document.getElementById('phone').value),address:cleanOneLine(document.getElementById('address').value),
      opinion:document.getElementById('opinion').value.trim()};
  }
  function formatMessage(v){return ['【里民意見表】','姓名：'+v.name,'電話：'+v.phone,'地址：'+v.address,
    '意見內容：',v.opinion,'表單編號：'+v.id].join('\n');}
  function canSendToCurrentChat(){
    const context=liff.getContext&&liff.getContext();
    return !!(liff.isInClient()&&context&&context.type==='utou');
  }
  function submitToGAS(v){
    const url=String(config.gasUrl||'');
    if(!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:\?.*)?$/.test(url))throw new Error('GAS 網址未設定。');
    const token=liff.getAccessToken&&liff.getAccessToken();
    if(!token)throw new Error('LINE 登入資訊已失效，請由原聊天室重新開啟表單。');
    const body=new URLSearchParams({
      form_action:'resident_feedback',
      access_token:token,
      name:v.name,
      phone:v.phone,
      address:v.address,
      opinion:v.opinion,
      submission_id:v.id,
      line_send_status:'liff_sent'
    });
    if(!(navigator.sendBeacon&&navigator.sendBeacon(url,body)))throw new Error('背景送件無法啟動。');
  }
  async function init(){
    if(!window.liff){setStatus('無法載入 LINE 元件，請重新開啟表單。',true);return;}
    if(!/^\d+-[A-Za-z0-9]+$/.test(String(config.liffId||''))){setStatus('LIFF ID 尚未設定。',true);return;}
    try{
      await liff.init({liffId:config.liffId,withLoginOnExternalBrowser:true});
      if(!liff.isLoggedIn()){
        if(!liff.isInClient())liff.login();
        else throw new Error('LIFF 登入未完成。');
        return;
      }
      if(!canSendToCurrentChat()){
        ready=false;submit.disabled=true;
        setStatus('請從手機 LINE 官方帳號聊天室開啟表單。',true);
        return;
      }
      ready=true;submit.disabled=false;
      setStatus('');
    }catch(err){setStatus('無法連線 LINE：'+(err.message||String(err)),true);}
  }
  form.addEventListener('submit',async function(ev){
    ev.preventDefault();
    if(!ready||sending)return;
    const v=getFormData();
    if(!v.name||!v.phone||!v.address||!v.opinion){setStatus('姓名、電話、地址及意見內容皆為必填。',true);return;}
    if(v.opinion.length>1600){setStatus('意見內容不得超過 1600 字。',true);return;}
    const message=formatMessage(v);
    if(message.length>4900){setStatus('送至 LINE 的訊息過長。',true);return;}
    if(!canSendToCurrentChat()){
      setStatus('目前不是 LINE 聊天室模式，無法自動傳送，資料未提交。請從原官方帳號的 LINE 聊天室重新開啟。',true);
      return;
    }
    if(!(liff.getAccessToken&&liff.getAccessToken())){setStatus('LINE 登入資訊失效，請重新開啟表單，尚未送訊。',true);return;}
    sending=true;submit.disabled=true;
    setStatus('正在由您的 LINE 帳號自動送出意見…');
    try{
      await liff.sendMessages([{type:'text',text:message}]);
    }catch(err){
      // Never turn a failed or ambiguous LINE send into an incomplete GAS-only receipt.
      console.warn('LIFF sendMessages not confirmed: ',err&&err.code||'unknown');
      setStatus('LINE 尚未確認訊息送達，未從本頁提交資料庫。請確認原聊天紀錄是否已出現訊息，再決定是否重新送出。',true);
      sending=false;submit.disabled=false;
      return;
    }
    setStatus('');
    try{
      submitToGAS(v);
      if(liff.isInClient())liff.closeWindow();
    }catch(err){
      setStatus('LINE 已送訊，但資料庫提交發生錯誤：'+(err.message||String(err))+'。請勿重複送出 LINE 訊息。',true);
      sending=false;submit.disabled=false;
    }
  });
  init();
})();
</script>
</body>
</html>
